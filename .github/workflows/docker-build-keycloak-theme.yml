name: Build Keycloak Docker Image

on:
  push:
    branches: [ "main" ]
    # tags: [ 'v*.*.*' ]
    # paths:
    #   - 'config/keycloak-theme/**'
    #   - '.github/workflows/WORKFLOW-docker-build.yml'
    #   - '.github/workflows/docker-build-keycloak-theme.yml'
  pull_request:
    branches: [ "main" ]
    # paths:
    #   - 'config/keycloak-theme/**'
    #   - '.github/workflows/WORKFLOW-docker-build.yml'
    #   - '.github/workflows/docker-build-keycloak-theme.yml'

jobs:
  build-keycloak:
    uses: ./.github/workflows/WORKFLOW-docker-build.yml
    with:
      context: .
      image_name: floodnet-nyc/floodnet-keycloak-theme
      signing: ${{ github.event_name != 'pull_request' }}

  # v2: the Keycloakify provider jar (login, account, admin, email).
  build-keycloakify:
    uses: ./.github/workflows/WORKFLOW-docker-build.yml
    with:
      context: keycloakify
      image_name: floodnet-nyc/floodnet-keycloakify-theme
      signing: ${{ github.event_name != 'pull_request' }}
